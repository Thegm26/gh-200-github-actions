name: release lab solution
on:
  workflow_dispatch:
    inputs:
      deploy: { description: Deploy, required: true, type: boolean }
      region: { description: Region, required: true, default: test, type: string }
defaults: &bash-defaults
  run: { shell: bash }
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=1.4.0" >> "$GITHUB_OUTPUT"
  test-linux:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: [20, 22]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    defaults: *bash-defaults
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.npm
          key: "npm-${{ runner.os }}-${{ matrix.node }}"
      - run: |
          echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres" >> "$GITHUB_ENV"
          echo "## ${{ needs.prepare.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
      - run: echo test-${{ matrix.node }} > report.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "report-ubuntu-${{ matrix.node }}"
          path: report.txt
  test-windows:
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: { node: [20] }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: echo test-${{ matrix.node }} > report.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "report-windows-${{ matrix.node }}"
          path: report.txt
